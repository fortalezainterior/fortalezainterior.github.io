name: refresh-token

# Source of truth: public_files/ in the private stoic-autopilot repository (generator/public_repo.py copies it here).

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-publisher.txt
      - name: Refresh token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m publisher.refresh_token --out "$RUNNER_TEMP/ig_token"
      - name: Store new token
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
